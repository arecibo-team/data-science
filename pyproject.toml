[project]
name = "firms-hotspots"
version = "0.1.0"
description = "Fetch, normalize and harmonize NASA FIRMS MODIS and VIIRS active-fire detections"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "shapely>=2.2.0",
  "pystac-client>=0.9.1",
  "planetary-computer>=1.0.0",
  "odc-stac>=0.5.3",
  "rasterio>=1.4.4",
  "numpy>=2.4.6",
  "xarray>=2026.9.0",
  "fastapi>=0.163.0",
  "uvicorn>=0.54.0",
  "lightgbm>=4.7.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
