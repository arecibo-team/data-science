[project]
name = "firms-hotspots"
version = "0.1.0"
description = "Fetch, normalize and harmonize NASA FIRMS MODIS and VIIRS active-fire detections"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.31",
  "python-dotenv>=1.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "shapely>=2.2.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
